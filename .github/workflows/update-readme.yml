name: Update README Automation

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TIMESTAMP_LINE="Last updated: $DATE"

          if [ -f README.md ]; then
            if grep -q "Last updated:" README.md; then
              sed -i "s/Last updated:.*/$TIMESTAMP_LINE/" README.md
            else
              printf "\n%s\n" "$TIMESTAMP_LINE" >> README.md
            fi
          else
            printf "# Repository\n\n%s\n" "$TIMESTAMP_LINE" > README.md
          fi

          git config user.name "Brajesh31"
          git config user.email "brajesh31.dev@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
            exit 0
          fi

          git commit -m "chore: update README timestamp"
          git push origin HEAD